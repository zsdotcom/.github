name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: standard-reference
    attributes:
      label: Related standard or guideline (if any)
      description: WHO / SPHERE / UNHCR / ISO reference, if this maps to a specific standard
    validations:
      required: false
