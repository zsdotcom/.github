# OPTIONAL — copy only if you want an AI PR reviewer/triage bot and are willing to pay for the
# Anthropic API tokens it consumes. This is NOT part of the zero-cost baseline.
#
# Requires: an ANTHROPIC_API_KEY repo secret (Settings -> Secrets and variables -> Actions).
# Docs: https://github.com/anthropics/claude-code-action
#
# Security note: this only runs on @claude mentions (not automatically on every push/PR), and
# is scoped to `issue_comment`/`pull_request_target` from users with at least triage access,
# via `github_token` permission checks the action does internally. Do NOT widen this to run
# unattended on fork PRs from arbitrary contributors — that would hand your API key's blast
# radius to anyone who can open a PR.
name: Claude PR assistant (optional, paid)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
